name: Build and Deploy to GKE

on:
  push:
    branches: ["main"]

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GKE_REGION }}
  CLUSTER_NAME: ${{ vars.GKE_CLUSTER_NAME }}
  GAR_LOCATION: ${{ vars.GKE_REGION }}-docker.pkg.dev
  REPOSITORY: my-ecommerce-repo
  BACKEND_IMAGE: e-commerce-backend
  FRONTEND_IMAGE: e-commerce-frontend

jobs:
  setup-build-publish-deploy:
    name: Setup, Build, Publish, and Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - id: "auth"
        uses: "google-github-actions/auth@v3"
        with:
          credentials_json: "${{ secrets.GCP_SA_KEY }}"

      - name: Configure gcloud and Docker
        run: |
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}

      - name: Create Production Env File
        run: |
          echo "${{ secrets.PROD_BACKEND_ENV }}" > k8s/overlays/production/production.env

      - name: Build and Push Backend
        run: |
          docker build \
            -t ${{ env.GAR_LOCATION }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
            ./backend
          docker push ${{ env.GAR_LOCATION }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Build and Push Frontend
        run: |
          docker build \
            --build-arg VITE_APP_NAME=${{ vars.VITE_APP_NAME }} \
            --build-arg VITE_APP_API_URL="http://${{ vars.GCP_BACKEND_IP }}:3001/api" \
            --build-arg VITE_STRIPE_PUBLISHABLE_KEY="${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}" \
            -t ${{ env.GAR_LOCATION }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
            ./frontend
          docker push ${{ env.GAR_LOCATION }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

      - uses: "google-github-actions/get-gke-credentials@v3"
        with:
          cluster_name: "${{ env.CLUSTER_NAME }}"
          location: "${{ env.REGION }}"

      - name: Deploy
        run: |
          cd k8s/overlays/production
          kustomize edit set image ${{ env.BACKEND_IMAGE }}=${{ env.GAR_LOCATION }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          kustomize edit set image ${{ env.FRONTEND_IMAGE }}=${{ env.GAR_LOCATION }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          kubectl apply -k .