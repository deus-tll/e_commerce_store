apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - path: deployment-patches.yaml

  - target:
      kind: Service
      name: backend-service
    patch: |-
      - op: replace
        path: /spec/type
        value: LoadBalancer
  - target:
      kind: Service
      name: frontend-service
    patch: |-
      - op: replace
        path: /spec/type
        value: LoadBalancer
        
secretGenerator:
  - name: backend-env
    envs:
      - production.env